name: twin-subactor

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v

  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m json.tool config/sources.json >/dev/null
      - run: python -m json.tool schemas/ecosystem-snapshot.schema.json >/dev/null
      - run: PYTHONPATH=src python -m twin_subactor.cli --offline snapshot >/dev/null
      - run: docker build .
