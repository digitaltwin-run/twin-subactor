[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-subactor"
version = "0.1.0"
description = "Read-only Digital Twin of the Subactor ecosystem"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
twin-subactor = "twin_subactor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
